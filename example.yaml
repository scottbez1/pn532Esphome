esphome:
  name: nfc-reader
  platform: ESP32
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:

external_components:
  - source: .
    components: [pn532_spi]

pn532_spi:
  # SPI pins — adjust to match your wiring
  cs_pin: GPIO5
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

  # How often to poll for a tag (default 150ms)
  update_interval: 150ms

  on_tag:
    - logger.log:
        format: "Tag presented: %s"
        args: ['uid.c_str()']
    # Example: publish UID to an MQTT topic
    # - mqtt.publish:
    #     topic: nfc/tag
    #     payload: !lambda 'return uid;'

  on_tag_removed:
    - logger.log: "Tag removed"
