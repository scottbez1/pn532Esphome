esphome:
  name: nfc-reader
  platform: ESP32
  board: esp32-c3-devkitm-1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:

external_components:
  - source: .
    components: [pn532_spi]

# SPI bus — adjust pins to match your wiring
spi:
  clk_pin: GPIO6
  miso_pin: GPIO5
  mosi_pin: GPIO7

pn532_spi:
  cs_pin: GPIO10

  # How often to poll for a tag (default 150 ms).
  # With MaxRtyPassiveActivation=2, each poll completes in < 10 ms,
  # so the main loop is nearly unaffected.
  update_interval: 150ms

  on_tag:
    - logger.log:
        format: "Tag presented: %s"
        args: ['uid.c_str()']

  on_tag_removed:
    - logger.log: "Tag removed"
